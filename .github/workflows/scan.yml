# UTC cron is a superset of US regular hours across EST and EDT plus Hong Kong
# regular hours, weekdays only. America/New_York daylight saving is not encoded
# as a fixed UTC offset: scanner/hours.py decides whether a market is open.
# Hong Kong lunch (12:00–13:00 Asia/Hong_Kong, 04:00 and 04:30 UTC) is included.
# The 16:00 local close is outside the open interval, so it is not scheduled.
name: scan

on:
  schedule:
    - cron: "30 1 * * 1-5" # 09:30 Asia/Hong_Kong
    - cron: "*/30 2-7 * * 1-5" # 10:00–15:30 Asia/Hong_Kong, including lunch
    - cron: "30 13 * * 1-5" # 09:30 America/New_York during EDT; 08:30 during EST
    - cron: "*/30 14-20 * * 1-5" # through 15:30 local, both EST and EDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effort-vs-result-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Run scanner
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m scanner --scheduled --push
          else
            python -m scanner --push
          fi
